# Production nginx site for Friday's Fragrances (static SPA).
# Install: copy to /etc/nginx/sites-available/fridays, symlink into sites-enabled,
# remove the default site, then `nginx -t && systemctl reload nginx`.
# When a real domain is attached: set server_name and run
#   certbot --nginx -d example.com -d www.example.com
# which rewrites the TLS block and adds the HTTP->HTTPS redirect + HSTS.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fridays;
    index index.html;

    location ~ /\. { deny all; return 404; }
    location / { try_files $uri $uri/ /index.html; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fridays-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/fridays-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/fridays;
    index index.html;

    location ~ /\. { deny all; return 404; }
    location / { try_files $uri $uri/ /index.html; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
