# Production nginx site for Friday's Fragrances (static SPA).
# Install: copy to /etc/nginx/sites-available/fridays, symlink into sites-enabled,
# remove the default site, then `nginx -t && systemctl reload nginx`.
# Requires deploy/nginx-optimizations.conf in /etc/nginx/conf.d/ (gzip, rate-limit zone).
# When a real domain is attached: set server_name and run
#   certbot --nginx -d example.com -d www.example.com
# which rewrites the TLS block and adds the HTTP->HTTPS redirect + HSTS.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.google-analytics.com https://*.analytics.google.com https://firebaseinstallations.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://apis.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fridays;
    index index.html;

    client_max_body_size 2m;
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }

    location ~ /\. { deny all; return 404; }

    location / {
        limit_req zone=fridays burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fridays-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/fridays-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/fridays;
    index index.html;

    client_max_body_size 2m;
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }

    location ~ /\. { deny all; return 404; }

    location / {
        limit_req zone=fridays burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
