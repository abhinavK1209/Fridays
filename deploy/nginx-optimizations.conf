# Install to /etc/nginx/conf.d/optimizations.conf (http context).
# Performance + abuse-mitigation settings shared by all sites.

# gzip (gzip itself is enabled in the stock nginx.conf http block)
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

# static-file serving (sendfile/tcp_nopush are enabled in the stock nginx.conf)
tcp_nodelay on;
keepalive_timeout 30;
open_file_cache max=2000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# request hardening
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 12s;
large_client_header_buffers 2 8k;

# per-IP request rate limiting (referenced as `zone=fridays` in the site config)
limit_req_zone $binary_remote_addr zone=fridays:10m rate=20r/s;
limit_req_status 429;
